[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rompy-perth-demo"
version = "0.1.0"
description = "A demonstration repository showcasing the use of Rompy for configuring and running SWAN models"
authors = [{name = "Rompy Team"}]
requires-python = ">=3.8"
dependencies = [
    "rompy",
    "rompy-swan",
    "rompy-oceanum",
    "oceanumlab",
    "xarray",
    "matplotlib",
    "cartopy",
    "wavespectra",
]

[project.entry-points."rompy.postprocess"]
plotting = "rompy_perth_demo.plotting_postprocessor:PlottingPostprocessor"

[tool.setuptools.packages.find]
include = ["rompy_perth_demo*"]