# Local Backend Configuration
# Configuration for executing models on the local system

# Backend type specification
type: local

# Configuration parameters
timeout: 7200 # 2 hours - Maximum execution time in seconds (60-86400)

# Optional shell command
command: swan.exe

# Whether to capture stdout and stderr (default: true)
capture_output: true

# Optional working directory for execution
# If not specified, defaults to the model's output directory
# working_dir: "/path/to/working/directory"

# Additional environment variables to set during execution
env_vars:
  OMP_NUM_THREADS: "4"
  DATA_DIR: "/data"
  LOG_LEVEL: "INFO"
